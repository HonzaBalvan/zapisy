<html><head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title></title>
<link rel="stylesheet" type="text/css" href="11e%20-%20javas3b_files/styl.css">
<script language="JavaScript">
function vypln(){
  mesic=document.getElementById("mesic").value-1;
  rok=document.getElementById("rok").value;
  prvniho=new Date(rok,mesic,1,0,0,10);
  den=prvniho.getDay();
  posun=(den+6)%7;
  den=1-posun;
  kalendar="<table>\n<tr>";
  while (true){
    pom=new Date(rok,mesic,den,0,0,10);
    if (pom.getMonth()==mesic){
      kalendar+="<td>"+den+"</td>";
    }else{
      kalendar+="<td>&nbsp;</td>";
    }
    if (((posun+den-1)%7)==6){
      kalendar+="</tr>\n";
      pom=new Date(rok,mesic,den+1,0,0,10);
      if (pom.getMonth()>mesic){
        break;
      }else{
        kalendar+="<tr>";
      }
    }
    den++;
  }
  kalendar+="</table>\n";
  document.getElementById("kalendar").innerHTML=kalendar;
  document.getElementById("kalendar").style.position="absolute";
  document.getElementById("kalendar").style.top="100";
  document.getElementById("kalendar").style.left="300";
  document.getElementById("kalendar").style.visibility="visible";
}
</script>
</head>
<body>
<form>
Rok:<input name="rok" id="rok"><br>
Mesic:<input name="mesic" id="mesic"><br>
<input type="button" onclick="vypln();">
</form>
<br>
<span id="kalendar" style="border-style:solid;border:color:black;border-width:1px;visibility:hidden;">
</span>


</body></html>

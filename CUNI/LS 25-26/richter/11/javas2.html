function kontrola(){
  email=document.getElementById("email").value;
  var re = /^[_a-zA-Z0-9\.\-]+@[_a-zA-Z0-9\.\-]+\.[a-zA-Z]{2,4}$/;
  if (re.test(email)){
    return true;
  }else{
    window.alert("Nesprávná forma e-mailové adresy!");
    return false;
  }
}
</script>
